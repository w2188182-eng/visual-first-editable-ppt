[custom]
; ============================================================
; 自定义 Clash / Mihomo 订阅转换配置
; 适配：edgetunnel + CF优选 + Reality + Hysteria2
; ============================================================

; ChatGPT / OpenAI
ruleset=ChatGPT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=ChatGPT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; TikTok
ruleset=TikTok,[]DOMAIN-SUFFIX,tiktok.com
ruleset=TikTok,[]DOMAIN-SUFFIX,tiktokv.com
ruleset=TikTok,[]DOMAIN-SUFFIX,tiktokcdn.com
ruleset=TikTok,[]DOMAIN-SUFFIX,musical.ly
ruleset=TikTok,[]DOMAIN-SUFFIX,byteoversea.com
ruleset=TikTok,[]DOMAIN-SUFFIX,ibytedtos.com
ruleset=TikTok,[]DOMAIN-SUFFIX,ibytedapm.com
ruleset=TikTok,[]DOMAIN-SUFFIX,muscdn.com

; Google / YouTube
ruleset=Google/YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=Google/YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

; GitHub
ruleset=GitHub,[]DOMAIN-SUFFIX,github.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubassets.com
ruleset=GitHub,[]DOMAIN-SUFFIX,github.io
ruleset=GitHub,[]DOMAIN-SUFFIX,githubcopilot.com

; Telegram
ruleset=Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; Microsoft
ruleset=Microsoft,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=Microsoft,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=Microsoft,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list

; Apple
ruleset=Apple,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; 国外流量
ruleset=国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; 广告过滤
ruleset=广告过滤,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=广告过滤,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; 国内直连
ruleset=国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=国内直连,[]GEOIP,CN

; 未命中流量
ruleset=国外流量,[]FINAL

; ============================================================
; 策略组
; ============================================================

; 当前 edgetunnel 优选节点名包含“优选”，同时兼容 CF/Cloudflare 命名
custom_proxy_group=CF自动优选`url-test`(优选|CF|Cloudflare|CloudFlare)`http://www.gstatic.com/generate_204`300,,50

; 主固定出口默认先放 CF自动优选，并自动纳入订阅中的全部节点。
; 这样以后新增/改名 Reality、HY2 或其它备用节点，也会自动出现，不依赖节点命名。
custom_proxy_group=主固定出口`select`[]CF自动优选`.*

; 业务组
custom_proxy_group=ChatGPT`select`[]主固定出口
custom_proxy_group=TikTok`select`[]主固定出口
custom_proxy_group=Google/YouTube`select`[]主固定出口
custom_proxy_group=GitHub`select`[]主固定出口
custom_proxy_group=Telegram`select`[]主固定出口
custom_proxy_group=Microsoft`select`[]主固定出口
custom_proxy_group=Apple`select`[]主固定出口
custom_proxy_group=国外流量`select`[]主固定出口

; 国内与广告
custom_proxy_group=国内直连`select`[]DIRECT`[]主固定出口
custom_proxy_group=广告过滤`select`[]REJECT`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
